name: Build branches

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        rails_version: ['7.2.3']

    # Define environment variables globally for the job
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432
      NOKOGIRI_USE_SYSTEM_LIBRARIES: true
      VLR_SITE_ID: commonwealth

    # Services start sidecar containers (Postgres) automatically
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Health check ensures Postgres is ready before the script runs
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: browser-actions/setup-chrome@v2
      - run: chrome --version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler-cache: true

      - name: Update RubyGems
        run: gem update --system --no-document

      - name: Install Bundler 2.7.2
        run: gem install bundler -v 2.7.2 --no-document

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          # cache-dependency-path: './spec/internal/yarn.lock'
          cache-dependency-path: './spec/dummy/yarn.lock'

      - name: Install bundle packages
        run: bundle install

      - name: Install yarn packages
        run: yarn install
        # working-directory: ./spec/internal
        working-directory: ./spec/dummy

      - name: Compile yarn CSS
        run: yarn build:css
        # working-directory: ./spec/internal
        working-directory: ./spec/dummy

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # - name: Verify Chrome
      #   run: |
      #     chrome --version || true
      #     google-chrome --version || true
      #     which chrome || true
      #     which google-chrome || true

      - name: Start headless Chrome
        run: |
          CHROME_BIN=$(which chrome || which google-chrome)

          $CHROME_BIN \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --remote-debugging-port=9222 \
            about:blank &

          sleep 5

      ## Verify chrome running on :9222
      - name: Check Chrome debugging endpoint
        run: |
          curl http://127.0.0.1:9222/json/version


      - name: Create test database
        run: RAILS_ENV=test bundle exec rails db:test:prepare
        # run: RAILS_ENV=test bundle exec rails app:db:prepare
        # working-directory: ./spec/internal
        working-directory: ./spec/dummy

      - name: Run linter and tests
        run: RAILS_ENV=test bundle exec rake
        # working-directory: ./spec/dummy